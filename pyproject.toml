[project]
name = "cubctl"
version = "1.0.0"
description = "CLI and Python client for the CUB REST API (cub.rip)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Pikta" }]
keywords = ["cub", "cub.rip", "lampa", "cli", "bookmarks", "migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/pavelpikta/lampa-cub-cli"
Repository = "https://github.com/pavelpikta/lampa-cub-cli"
Documentation = "https://github.com/pavelpikta/lampa-cub-cli#readme"
Issues = "https://github.com/pavelpikta/lampa-cub-cli/issues"

[project.scripts]
cubctl = "cubctl.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: live API tests (requires CUB_TEST_DEVICE_CODE or token env vars)",
    "writes: mutating API calls (skipped unless CUB_TEST_WRITES=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cubctl = ["api_spec.json"]
